<style>
:root{--bg:#F7F4EE;--card:#FFFFFF;--line:#E3DDD0;--text:#1E2925;--muted:#767268;--soft:#EFEADD;--hero:#1F3D36;--pri:#1F3D36;--onpri:#F7F4EE;--acc:#C9794A;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1613;--card:#17211D;--line:#2A3731;--text:#F1EEE6;--muted:#9AA39C;--soft:#1E2A25;--pri:#E9E2D4;--onpri:#1F3D36;--acc:#E0925F}}
:root[data-theme="dark"]{--bg:#0F1613;--card:#17211D;--line:#2A3731;--text:#F1EEE6;--muted:#9AA39C;--soft:#1E2A25;--pri:#E9E2D4;--onpri:#1F3D36;--acc:#E0925F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:0 18px 100px}
h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:20px 0 6px;letter-spacing:-.3px}
h2{font-family:var(--serif);font-weight:400;font-size:19px;margin:26px 0 10px}
.sm{font-size:13px;color:var(--muted);margin:4px 0 0}
.hero{background:var(--hero);color:#F7F4EE;text-align:center;padding:44px 22px 36px;border-radius:0 0 28px 28px;margin:0 -18px}
.hero .wm{display:block;font-family:var(--serif);font-weight:400;font-size:38px;margin-top:14px;letter-spacing:.5px}
.hero .tl{display:block;color:#C9D6CF;font-size:15px;margin-top:2px}
.hero .pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hero .pill{font-size:12px;color:#E9E2D4;border:1px solid #3F6158;border-radius:20px;padding:4px 11px}
.bx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;margin-top:16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;background:var(--pri);color:var(--onpri)}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;color:var(--text);cursor:pointer}
.opt b{font-weight:600}
.opt span{display:block;font-size:13px;color:var(--muted)}
.opt.on{border:2px solid var(--pri);background:var(--soft);padding:12px 13px}
.opt.on b::before{content:"✓ ";color:var(--acc)}
.g1{display:grid;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.g3 .opt,.g4 .opt,.g5 .opt{text-align:center;padding:13px 4px}.g3 .opt.on,.g4 .opt.on,.g5 .opt.on{padding:12px 3px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:18px 6px 0}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin:0 6px 4px 0}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.met{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.met b{display:block;font-family:var(--serif);font-weight:400;font-size:26px}.met span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:12px}
.b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:12px;color:var(--muted)}
.b i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 0 0;min-height:4px}
.top{display:flex;align-items:center;padding-top:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px}
input[type=text],input[type=password],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:16px;margin-top:8px}
input[type=range]{width:100%;accent-color:#C9794A}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.big{font-family:var(--serif);font-size:64px;text-align:center;color:var(--acc);line-height:1.1;margin-top:8px}
.ok{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
summary{font-family:var(--serif);font-size:17px;cursor:pointer}
details p{font-size:14px;margin:8px 0 0}
.today{background:var(--hero);color:#F7F4EE;border-radius:20px;padding:20px;margin-top:14px}
.today .sm{color:#B9C9C2}.today .li{border-color:#34564D}.today .li .sm{color:#9DB3AA}
.today .btn{background:#E9E2D4;color:#1F3D36}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--c,#C9794A)}
.f-E{--c:#5E8C7E}.f-M{--c:#6F8FA8}.f-A{--c:#D4A24C}.f-R{--c:#C9794A}.f-I{--c:#8C6F9E}.f-D{--c:#B5523B}
.nav{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;padding:8px 4px;cursor:pointer;border-radius:12px}
.nav svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--text);font-weight:600;background:var(--soft)}
.stage{background:#F7F4EE;border:1px solid var(--line);border-radius:18px;padding:6px;margin-top:12px}
.stage svg{display:block;margin:0 auto;width:100%;max-height:290px}
</style>
</head>

var AC=null,snd=true;

function beep(f,d,v){
if(!snd||!AC)return;
try{
var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
o.type='sine';o.frequency.value=f;
g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.25,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);
}catch(e){}
}
function melody(){beep(523,0.16,0.25);setTimeout(function(){beep(659,0.16,0.25)},170);setTimeout(function(){beep(784,0.35,0.28)},340)}
function stop(){if(gT){clearInterval(gT);gT=null}}
function tick(){
stop();
gT=setInterval(function(){
var r=flow;
if(!r||r.k!=='run'||!r.run)return;
r.left--;
var t=$('gt');if(t)t.textContent=r.left;
if(r.left>0&&r.left<=3)beep(660,0.1,0.22);
if(r.left<=0){try{if(navigator.vibrate)navigator.vibrate(200)}catch(x){}if(r.ph==='rest'){beep(988,0.35,0.28);initEx()}else afterSet()}
},1000);
}
function initEx(){var r=flow,it=r.items[r.i],e=EX[it.id];r.ph='ex';r.run=false;r.left=e.u==='s'?it.reps:0;tick();render()}
function afterSet(){
var r=flow,it=r.items[r.i],ls=r.s>=it.sets,le=r.i>=r.items.length-1;
if(ls&&le){stop();melody();flow={k:'end',sess:r.sess,n:r.items.length};render();return}
if(ls){r.i++;r.s=1}else r.s++;
beep(523,0.2,0.25);
r.ph='rest';r.left=it.rest;r.run=true;tick();render();
}
